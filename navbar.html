<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kevin Blinn - Main Navbar</title>
  <link rel="stylesheet" href="./navStyle.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
</head>
<body>
  <div class="wrapper">
    <nav>
      <input type="checkbox" id="show-search">
      <input type="checkbox" id="show-menu">
      <label for="show-menu" class="menu-icon" aria-label="Toggle menu">
        <i class="fas fa-bars" aria-hidden="true"></i>
      </label>

      <div class="content">
        <div class="logo"><a href="/">Kevin Blinn</a></div>
        <ul class="links">
          <li><a href="/">Home</a></li>
          <li><a href="/projects/">Projects</a></li>
          <li><a href="/disney/index.html">Disney</a></li>
          <li><a href="/resume/resume.html" target="_blank" rel="noopener">Resume</a></li>
          <li><a href="https://github.com/KJBlinn01" target="_blank" rel="noopener">GitHub</a></li>
          <li><a href="mailto:kevin.blinn.cs@gmail.com">Email</a></li>
        </ul>
      </div>

      <label for="show-search" class="search-icon" aria-label="Toggle search">
        <i class="fas fa-search" aria-hidden="true"></i>
      </label>
      <form action="/search/" method="get" class="search-box" role="search">
        <input name="q" type="text" placeholder="Search…" required aria-label="Search" />
        <button type="submit" class="go-icon" aria-label="Go">
          <i class="fas fa-long-arrow-alt-right" aria-hidden="true"></i>
        </button>
      </form>
    </nav>
  </div>
</body>
</html>
